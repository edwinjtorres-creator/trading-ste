[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ste"
version = "0.1.0"
description = "STE — Sistema de Trading Evolutivo (núcleo mínimo: señal, régimen, riesgo, verificación)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "pyarrow>=15.0",
    "pydantic>=2.0",
]

[project.scripts]
ste = "ste.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.4.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
